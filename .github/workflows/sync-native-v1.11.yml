name: Sync TgWsProxy runtime v1.11.0

on:
  push:
    branches:
      - feat/issue-5-sync-v1.11.0

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout core
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout stable Android runtime source
        uses: actions/checkout@v4
        with:
          repository: Regstar2/tg-ws-proxy-android
          ref: c5c4d03ce6f731642cfd5d66d0bdc56377606831
          path: .sync-source

      - name: Mirror native runtime and tests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf native/tgwsproxy
          mkdir -p native
          cp -a .sync-source/native/tgwsproxy native/tgwsproxy
          rm -rf .sync-source

      - name: Update provenance and dependency notices
        shell: bash
        run: |
          set -euo pipefail
          cat > docs/provenance.md <<'EOF'
          # Provenance

          Initial extraction source:

          - repository: `Regstar2/tg-ws-proxy-android`;
          - commit: `b2558f16f8a46aa3abec2660acd606bffdfac613`;
          - path: `native/tgwsproxy/`;
          - application version: `1.10.13`;
          - extraction date: 2026-09-07.

          Current synchronized runtime:

          - repository: `Regstar2/tg-ws-proxy-android`;
          - commit: `c5c4d03ce6f731642cfd5d66d0bdc56377606831`;
          - path: `native/tgwsproxy/`;
          - application version: `1.11.0`;
          - synchronization date: 2026-09-20.

          The reusable core mirrors the complete native runtime source and tests from the synchronized Android commit. The core-specific Android AAR wrapper, minSdk 21 build path, Kotlin API, and consumer rules remain maintained in this repository.

          UI, Compose, Service, preferences and branding from the standalone Android application are intentionally excluded.
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              "Исходный runtime извлекается из `Regstar2/tg-ws-proxy-android` commit `b2558f16f8a46aa3abec2660acd606bffdfac613`. Исходный репозиторий при extraction не изменяется.",
              "Native runtime синхронизирован с `Regstar2/tg-ws-proxy-android` commit `c5c4d03ce6f731642cfd5d66d0bdc56377606831` (v1.11.0). Исходный Android-репозиторий при синхронизации не изменяется."
          )
          s = s.replace(
              "- WebSocket/Cloudflare route runtime;\n",
              "- Cloudflare Proxy, Direct WebSocket и Cloudflare Worker routes;\n- AWG/WARP userspace runtime из v1.11.0;\n- актуальные route health/cooldown, Worker failover и WebSocket transport improvements;\n"
          )
          s = s.replace(
              "- `tg-ws-proxy-android` пока продолжает использовать собственную копию runtime.",
              "- Android app и core синхронизируются явно по pinned source commit."
          )
          p.write_text(s, encoding="utf-8")
          PY

          cat > NOTICE.md <<'EOF'
          # Third-party notices

          TgWsProxy Core native runtime is synchronized from `Regstar2/tg-ws-proxy-android` commit
          `c5c4d03ce6f731642cfd5d66d0bdc56377606831` (v1.11.0).

          Project-level code is distributed under GNU GPL v3. Third-party components retain their own terms.

          | Component | Revision/version | License |
          |---|---|---|
          | Regstar2/tg-ws-proxy-android runtime | `c5c4d03ce6f731642cfd5d66d0bdc56377606831` | GNU GPL v3 |
          | Flowseal/tg-ws-proxy origin | `c02398fbc0af432ecb9ccacb7be7d97cdf5e74cf` | MIT |
          | JNA | 5.14.0 | Apache-2.0 OR LGPL-2.1; Apache-2.0 option used here |
          | github.com/amnezia-vpn/amneziawg-go/v3 | v3.1.20260828 | MIT |
          | github.com/refraction-networking/utls | v1.8.2 | BSD 3-Clause |
          | github.com/andybalholm/brotli | v1.1.1 | MIT |
          | github.com/google/btree | v1.1.3 | Apache-2.0 |
          | github.com/klauspost/compress | v1.17.11 | BSD 3-Clause |
          | golang.org/x/crypto | v0.42.0 | BSD 3-Clause |
          | golang.org/x/net | v0.44.0 | BSD 3-Clause |
          | golang.org/x/sys | v0.36.0 | BSD 3-Clause |
          | golang.org/x/time | v0.9.0 | BSD 3-Clause |
          | golang.zx2c4.com/wintun | `0fa3db229ce2` | GPL-2.0 |
          | gvisor.dev/gvisor | `1f7806d17489` | Apache-2.0 |
          | Go runtime/toolchain | Go 1.25 baseline | BSD 3-Clause-style + patent grant |

          Existing license texts remain under `third_party/`. The exact synchronized Go module graph is recorded in `native/tgwsproxy/go.mod` and `go.sum`.
          EOF

      - name: Verify mirrored source
        shell: bash
        run: |
          set -euo pipefail
          diff -qr native/tgwsproxy <(true) >/dev/null 2>&1 || true
          cd native/tgwsproxy
          go mod verify
          go test ./...

      - name: Commit synchronized runtime
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/sync-native-v1.11.yml
          git add native/tgwsproxy README.md NOTICE.md docs/provenance.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync native runtime with tg-ws-proxy-android v1.11.0"
          git push origin HEAD:feat/issue-5-sync-v1.11.0
